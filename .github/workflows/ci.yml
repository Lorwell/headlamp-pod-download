name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm tsc

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build plugin
        run: pnpm build

      - name: Upload plugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: headlamp-pod-download
          path: dist/
          if-no-files-found: error
